name: claude-task
on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行するタスク"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    environment: claude-run   # ここで承認待ちになる
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --allowedTools "Write"
          prompt: |
            ${{ inputs.task }}
            作業が終わったら、結果を result.json に
            {"status": "...", "summary": "...", "pr_url": "..."} の形式で書き出すこと。
      # 結果を成果物として保存（統合セッションが後から取得する）
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json
